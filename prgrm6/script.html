<DOCTYPE html>
<html>
<head>
<title>web</title>
</head>
<body bgcolor="powdergreen">
<h1><i><center>String And Math Functions</center></i></h1>
<script>
var a="hello";
var b="2";
var c="Have a nice day";
document.write("string1=" + a + "<br>");
document.write("string2=" + b + "<br>");
document.write("string3=" + c + "<br>");
document.write("<h2>Strings</h2>");
document.write("concatenation=" + a + b + c + "<br>");
document.write("length of c=" + c.length + "<br>");
document.write("uppercase=" + a.toUpperCase() + "<br>");
document.write("lowercase=" + a.toLowerCase() + "<br>");
document.write("replaced string=" + c.replace("nice","good") + "<br>");
document.write("substring=" + c.slice(1,7) + "<br>");
document.write("<h2>Math functions</h2>");
document.write("square root of 25=" + Math.sqrt(25) + "<br>");
document.write("power=" + Math.pow(2,3) + "<br>");
document.write("absolute value of -10=" + Math.abs(-10) + "<br>");
document.write("Round of (5.8)=" + Math.round(5.8) + "<br>");
document.write("ceil of (4.8)=" + Math.ceil(4.8) + "<br>");
document.write("floor of (4.8)=" + Math.floor(4.8) + "<br>");
document.write("minimum of (4,5,3,7,8)=" + Math.min(4,5,3,7,8) + "<br>");
document.write("maximum of (4,5,3,7,8)=" + Math.max(4,5,3,7,8) + "<br>");
</script>
</body>
</html>

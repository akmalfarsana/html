<!DOCTYPE html>
<html>
<head>
<title>background color</title>
</head>
<body>
<h1>Change Background</h1>
<button onclick="changeColor()">change</button>
<script>
let color=["Red","green","blue","orange","yellow"];
let i=0;
function changeColor(){
document.body.style.backgroundColor=color[i];
i++;
if(i==color.length)
{
i=0;
}
}
</script>
</body>
</html>
